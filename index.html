<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiny Towns Atlas</title>
    <meta
      name="description"
      content="Health and social context across Australia's small communities."
    />
    <link rel="stylesheet" href="/src/style/main.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div id="brand">
          <h1>Tiny Towns Atlas</h1>
          <p id="subtitle">Health and social context across Australia's small communities</p>
        </div>
        <div id="search-wrap">
          <input
            id="search-input"
            type="text"
            placeholder="Find a town..."
            autocomplete="off"
            aria-label="Find a town"
            role="combobox"
            aria-controls="search-results"
            aria-expanded="false"
            aria-autocomplete="list"
          />
          <ul id="search-results" role="listbox" hidden></ul>
        </div>
      </header>

      <main id="map-wrap">
        <div id="map"></div>
        <div id="layer-control">
          <label for="layer-select">Map layer</label>
          <!-- Native grouped options come from the shared layer registry. -->
          <select id="layer-select"></select>
          <p class="scope-note">Tiny towns with 100–1,499 usual residents.</p>
        </div>
        <div id="legend" aria-live="polite"></div>

        <aside id="panel" hidden>
          <button id="panel-close" aria-label="Close town profile">&times;</button>
          <button id="panel-handle" type="button" aria-label="Expand or collapse town profile" aria-expanded="false"></button>
          <div id="panel-content"></div>
        </aside>

        <div id="intro-blurb">
          <p>
            Explore 1,208 Australian towns with 100–1,499 residents. Find a town or choose a health
            layer to explore Census conditions and broader-area hospital estimates.
          </p>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
