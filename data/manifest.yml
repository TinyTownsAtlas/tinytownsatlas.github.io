# Human-readable source manifest for Tiny Towns Atlas.
# Machine-readable mirror lives at public/data/manifest.json, regenerated by scripts/build_data.py.

sources:
  - name: ABS 2021 Census (TableBuilder), UCL extract supplied by PHIDU (canonical master workbook)
    license: CC BY 4.0 (ABS Census data)
    attribution: "Australian Bureau of Statistics; extract prepared by PHIDU, Torrens University Australia"
    path: 05_source_archive/PHIDU_John_Glover/2026-09-23_final_delivery/_data_workbook-witth_details.xlsx
    derived: 06_derived_data/census/atlas_ucl_dataset.csv (scripts/build_analytic.py)
    row_count: 1803

  - name: Diabetology UCL analytic dataset (validation reference, UCLs with 200+ residents)
    doi: 10.5281/zenodo.22783233
    license: CC BY 4.0
    attribution: "Alexeev, Gwynne, Henson & Kirwan (2026); Australian Bureau of Statistics"
    row_count: 1743
    path: 01_public_source/zenodo/diabetes_ucl_analytic_dataset.csv

  - name: ABS ASGS Edition 3 - Urban Centres and Localities 2021 (GDA2020 shapefile)
    license: CC BY 4.0
    attribution: Australian Bureau of Statistics
    url: https://www.abs.gov.au/statistics/standards/australian-statistical-geography-standard-asgs/edition-3-july-2021-june-2026/access-and-downloads/digital-boundary-files
    file: UCL_2021_AUST_GDA2020_SHP.zip
    matched_count: 1803
    total_features: 1837

  - name: PHIDU hospital estimates by UCL (Population Health Area-derived), hospital_context.json only
    license: CC BY-NC-SA 3.0 AU (https://creativecommons.org/licenses/by-nc-sa/3.0/au/)
    attribution: "Public Health Information Development Unit (PHIDU), Torrens University Australia"
    path: 05_source_archive/PHIDU_John_Glover/prior_validated_sources/Hospital_data_workbook.xlsx
    derived: 06_derived_data/phidu_context/atlas_hospital_context.csv (scripts/build_phidu_context.py)
    indicators: public hospital admissions SR 2022/23; potentially preventable hospitalisations SR 2020/21

scope_definition: >
  Primary display universe: UCLs with 100-1,499 usual residents, excluding special/non-settlement
  records. This is a Tiny Towns Atlas product definition, not an official ABS definition of a town.
  The published diabetes paper used a 200-resident lower bound; the Atlas lowered it to 100 in
  October 2026.

primary_count: 1208
reference_count: 1803

indicators_added_2026_10:
  - "cancer_pct: Census-reported cancer (including remission), P_Cancer_Tot / Tot_P_P (LTHP block)"
  - "unemployment_rate_pct: unemployed / labour force (LFSP block); replaces the displayed unemployed_residents_pct (unemployed / all usual residents)"

ux2_census_health_conditions:
  source_block: LTHP Type of Long-term Health Condition, 2021 Census, place of usual residence
  numerator_headers: P_Diabetes_Tot, P_Cancer_Tot, P_Asthma_Tot, P_Arthritis_Tot, P_Mental_health_cond_Tot, P_Heart_disease_Tot, P_Lung_cond_Tot, P_Kidney_disease_Tot, P_Stroke_Tot, P_Dementia_Tot
  denominator_header: Tot_P_P
  definitions: https://www.abs.gov.au/census/guide-census-data/census-dictionary/2021/variables-topic/health/type-long-term-health-condition-lthp
  note: Census-reported long-term conditions, not clinical prevalence; not age-standardised.

default_map_layer: all_towns
point_area: proportional to usual-resident population on every map layer

excluded_from_v0_1:
  - Brewarrina/Ten4Ten participant screening data
  - confidential Ten4Ten community reports
  - PHIDU mortality, ED and condition-specific hospital estimates (only the two hospital ratios above are used)
  - older Small Towns empirical estimates
  - the old composite chronic-burden index
  - historical panel data not delivered/verified
