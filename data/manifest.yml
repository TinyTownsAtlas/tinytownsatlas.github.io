# Human-readable source manifest for Tiny Towns Atlas.
# Machine-readable mirror lives at public/data/manifest.json, regenerated by scripts/build_data.py.

sources:
  - name: ABS 2021 Census (TableBuilder), UCL extract supplied by PHIDU (canonical master workbook)
    license: CC BY 4.0 (ABS Census data)
    attribution: "Australian Bureau of Statistics; extract prepared by PHIDU, Torrens University Australia"
    path: 05_source_archive/PHIDU_John_Glover/2026-09-23_final_delivery/_data_workbook-witth_details.xlsx
    derived: 06_derived_data/census/atlas_ucl_dataset.csv (scripts/build_analytic.py)
    row_count: 1803

  - name: Diabetology UCL analytic dataset (validation reference, UCLs with 200+ residents)
    doi: 10.5281/zenodo.22783233
    license: CC BY 4.0
    attribution: "Alexeev, Gwynne, Henson & Kirwan (2026); Australian Bureau of Statistics"
    row_count: 1743
    path: 01_public_source/zenodo/diabetes_ucl_analytic_dataset.csv

  - name: ABS ASGS Edition 3 - Urban Centres and Localities 2021 (GDA2020 shapefile)
    license: CC BY 4.0
    attribution: Australian Bureau of Statistics
    url: https://www.abs.gov.au/statistics/standards/australian-statistical-geography-standard-asgs/edition-3-july-2021-june-2026/access-and-downloads/digital-boundary-files
    file: UCL_2021_AUST_GDA2020_SHP.zip
    matched_count: 1803
    total_features: 1837

scope_definition: >
  Primary display universe: UCLs with 100-1,499 usual residents, excluding special/non-settlement
  records. This is a Tiny Towns Atlas product definition, not an official ABS definition of a town.
  The published diabetes paper used a 200-resident lower bound; the Atlas lowered it to 100 in
  October 2026.

primary_count: 1208
reference_count: 1803

excluded_from_v0_1:
  - Brewarrina/Ten4Ten participant screening data
  - confidential Ten4Ten community reports
  - custom PHIDU hospitalisation/ED/PPH/mortality workbooks
  - older Small Towns empirical estimates
  - the old composite chronic-burden index
  - historical panel data not delivered/verified
