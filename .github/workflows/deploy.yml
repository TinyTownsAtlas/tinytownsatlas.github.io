name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # The tests include the My TEN4TEN release-rule, leakage and isolation checks. A failure stops the deploy.
      - run: npm test
      # The live site is the demo-mode build: the Tiny Towns Atlas plus the synthetic My TEN4TEN demo
      # at /my-ten4ten/. (The default `npm run build` is the Atlas alone.) Output goes to dist-demo/.
      - run: npm run build:demo
      # No BASE_PATH override: this repo is an organization root Pages site
      # (tinytownsatlas.github.io), served at "/", which is vite.config.ts's default base.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
